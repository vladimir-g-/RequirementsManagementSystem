openapi: 3.0.3
info:
  title: Requirements Management System API
  description: API серверной части системы управления требованиями, включая каталог типов связей и связи требований.
  version: 1.1.0
  license:
    name: Proprietary
servers:
  - url: http://localhost:3000
    description: Локальный сервер
tags:
  - name: Auth
    description: Аутентификация и текущая сессия
  - name: Config
    description: Справочники интерфейса
  - name: Groups
    description: Иерархические группы требований
  - name: Projects
    description: Проекты, доступные пользователю
  - name: Requirements
    description: Требования
  - name: Requirement prefixes
    description: Префиксы номеров требований (только администратор)
  - name: Requirement links
    description: Общий каталог типов и связи между требованиями
  - name: Users
    description: Пользователи (только администратор)
paths:
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Войти в систему
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Успешный вход. В ответе устанавливается cookie session.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/InvalidJson'
        '401':
          description: Неверный логин или пароль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Завершить текущую сессию
      operationId: logout
      security:
        - sessionCookie: []
      responses:
        '204':
          description: Сессия завершена, cookie session очищена
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ClearedSessionCookie'

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Получить текущего пользователя
      operationId: getCurrentUser
      responses:
        '200':
          description: Текущий пользователь или null, если сессия отсутствует
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    oneOf:
                      - $ref: '#/components/schemas/UserPublic'
                      - type: object
                        nullable: true

  /api/config:
    get:
      tags: [Config]
      summary: Получить справочники
      operationId: getConfig
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Справочники, загруженные из конфигурации приложения
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Config'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/projects:
    get:
      tags: [Projects]
      summary: Получить доступные проекты
      operationId: listProjects
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Для администратора возвращаются все проекты, для остальных пользователей — назначенные
          content:
            application/json:
              schema:
                type: object
                required: [projects]
                properties:
                  projects:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/groups:
    get:
      tags: [Groups]
      summary: Получить группы проекта
      operationId: listGroups
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ProjectIdQuery'
      responses:
        '200':
          description: Группы проекта с учётом прав доступа пользователя
          content:
            application/json:
              schema:
                type: object
                required: [groups]
                properties:
                  groups:
                    type: array
                    items:
                      $ref: '#/components/schemas/Group'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: У пользователя нет права просмотра групп
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [Groups]
      summary: Создать группу требований
      operationId: createGroup
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupRequest'
      responses:
        '201':
          description: Группа создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupResponse'
        '400':
          description: Не заполнены обязательные поля, указано неизвестный проект или родительская группа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Нет права создавать группы в указанном проекте
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/groups/{id}:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      tags: [Groups]
      summary: Получить группу по идентификатору
      operationId: getGroup
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Группа найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: У пользователя нет права просмотра группы
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Группа не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags: [Groups]
      summary: Обновить группу требований
      operationId: updateGroup
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupRequest'
      responses:
        '200':
          description: Группа обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupResponse'
        '400':
          description: Не заполнены обязательные поля, указано неизвестная родительская группа или недопустимая иерархия
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Недостаточно прав для изменения группы
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Группа не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Groups]
      summary: Удалить группу требований
      operationId: deleteGroup
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Группа удалена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Недостаточно прав для удаления группы
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Группа не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Нельзя удалить группу — в ней есть требования или есть дочерние группы
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/requirement-prefixes:
    get:
      tags: [Requirement prefixes]
      summary: Получить префиксы требований
      operationId: listRequirementPrefixes
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Префиксы для каждой пары проект–тип требования
          content:
            application/json:
              schema:
                type: object
                required: [prefixes]
                properties:
                  prefixes:
                    type: array
                    items:
                      $ref: '#/components/schemas/RequirementPrefix'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
    put:
      tags: [Requirement prefixes]
      summary: Сохранить префиксы требований
      operationId: updateRequirementPrefixes
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequirementPrefixesRequest'
      responses:
        '200':
          description: Префиксы сохранены
          content:
            application/json:
              schema:
                type: object
                required: [prefixes]
                properties:
                  prefixes:
                    type: array
                    items:
                      $ref: '#/components/schemas/RequirementPrefix'
        '400':
          description: Некорректный список, неизвестный проект или тип, дубликат пары или неверный формат префикса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'

  /api/requirement-link-types:
    get:
      tags: [Requirement links]
      summary: Получить каталог типов связей
      description: Доступно только пользователю с системной ролью «Администратор».
      operationId: listRequirementLinkTypes
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Единый для всех проектов каталог типов связей
          content:
            application/json:
              schema:
                type: object
                required: [types]
                properties:
                  types:
                    type: array
                    items:
                      $ref: '#/components/schemas/RequirementLinkType'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
    post:
      tags: [Requirement links]
      summary: Создать тип связи
      description: Доступно только администратору. Название должно быть уникальным без учёта регистра.
      operationId: createRequirementLinkType
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequirementLinkTypeWrite'
      responses:
        '201':
          description: Тип связи создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementLinkTypeResponse'
        '400':
          description: Некорректное или неполное тело запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '409':
          description: Тип связи с таким названием уже существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/requirement-link-types/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Идентификатор типа связи
        schema:
          type: string
    put:
      tags: [Requirement links]
      summary: Изменить тип связи
      description: Изменение направленности применяется ко всем существующим связям данного типа. Доступно только администратору.
      operationId: updateRequirementLinkType
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequirementLinkTypeWrite'
      responses:
        '200':
          description: Тип связи изменён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementLinkTypeResponse'
        '400':
          description: Некорректное или неполное тело запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '404':
          description: Тип связи не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Тип связи с таким названием уже существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Requirement links]
      summary: Удалить тип связи
      description: Удаляет также все связи этого типа во всех проектах, но не удаляет требования. Доступно только администратору.
      operationId: deleteRequirementLinkType
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Тип связи удалён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedRequirementLinkTypeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '404':
          description: Тип связи не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/users:
    get:
      tags: [Users]
      summary: Получить список пользователей
      operationId: listUsers
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Пользователи без хешей паролей
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserPublic'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
    post:
      tags: [Users]
      summary: Создать пользователя
      operationId: createUser
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserWrite'
      responses:
        '201':
          description: Пользователь создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Не заполнены обязательные поля, логин не уникален или указан неизвестный проект
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'

  /api/users/{id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    put:
      tags: [Users]
      summary: Обновить пользователя
      operationId: updateUser
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Пользователь обновлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Некорректные или конфликтующие данные пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '404':
          $ref: '#/components/responses/UserNotFound'
    delete:
      tags: [Users]
      summary: Удалить пользователя
      operationId: deleteUser
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Пользователь удален
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '400':
          description: Нельзя удалить текущего пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '404':
          $ref: '#/components/responses/UserNotFound'

  /api/requirements:
    get:
      tags: [Requirements]
      summary: Получить требования
      operationId: listRequirements
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ProjectIdQuery'
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/TypeQuery'
        - $ref: '#/components/parameters/PriorityQuery'
        - $ref: '#/components/parameters/StatusQuery'
        - $ref: '#/components/parameters/ComplexityQuery'
        - $ref: '#/components/parameters/ReleaseQuery'
      responses:
        '200':
          description: Требования и список релизов, найденных в видимой области
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: У пользователя нет права чтения требований
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [Requirements]
      summary: Создать требование
      operationId: createRequirement
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequirementWrite'
      responses:
        '201':
          description: Требование создано; номер формируется сервером
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementResponse'
        '400':
          description: Не заполнены обязательные поля или переданы значения вне справочников
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Нет права создавать требования в проекте
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/requirements/search:
    get:
      tags: [Requirement links]
      summary: Найти требование для связывания
      description: Поиск ограничен проектом исходного требования, исключает само исходное требование и возвращает не более 20 совпадений. Требуются права read и update.
      operationId: searchRequirementsForLink
      security:
        - sessionCookie: []
      parameters:
        - name: projectId
          in: query
          required: true
          description: Проект исходного требования
          schema:
            type: string
        - name: excludeId
          in: query
          required: true
          description: Идентификатор исходного требования, исключаемого из результатов
          schema:
            type: string
        - name: search
          in: query
          required: true
          description: Поисковая строка; поиск выполняется по номеру, описанию и типу требования
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Найденные требования того же проекта, максимум 20
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementLinkSearchResponse'
        '400':
          description: Не указан поисковый запрос или исходное требование не соответствует проекту
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Для поиска нужны права read и update в проекте
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/requirements/{id}/link-options:
    get:
      tags: [Requirement links]
      summary: Получить доступные типы связей для требования
      description: Требуются права read и update в проекте требования.
      operationId: getRequirementLinkOptions
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequirementId'
      responses:
        '200':
          description: Каталог типов, доступных при создании связи
          content:
            application/json:
              schema:
                type: object
                required: [types]
                properties:
                  types:
                    type: array
                    items:
                      $ref: '#/components/schemas/RequirementLinkType'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Для создания связи нужны права read и update
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/RequirementNotFound'

  /api/requirements/{id}/links:
    get:
      tags: [Requirement links]
      summary: Получить связи требования
      description: Требуется право read в проекте требования. Направленные связи возвращают стороны A и B в исходном направлении независимо от карточки, с которой запрошен список.
      operationId: listRequirementLinks
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequirementId'
      responses:
        '200':
          description: Связи требования с данными типа и обеих сторон
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementLinksResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Нет права просматривать связи требований в этом проекте
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/RequirementNotFound'

  /api/requirement-links:
    post:
      tags: [Requirement links]
      summary: Создать связь между требованиями
      description: Требуются права read и update. Требования должны быть разными и принадлежать одному проекту. Для направленного типа requirementAId — исходное требование, с карточки которого начата операция; requirementBId — выбранное требование. Между одной парой допускается только одна связь независимо от типа и направления.
      operationId: createRequirementLink
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequirementLinkWrite'
      responses:
        '201':
          description: Связь создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementLinkResponse'
        '400':
          description: Самосвязь, разные проекты или неизвестный тип связи
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Для создания связи нужны права read и update в проекте
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Одно из требований не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Эта пара требований уже связана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/requirement-links/{id}:
    delete:
      tags: [Requirement links]
      summary: Удалить связь между требованиями
      description: Требуются права read и update в проекте. Удаляются только связь, сами требования сохраняются.
      operationId: deleteRequirementLink
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          description: Идентификатор связи
          schema:
            type: string
      responses:
        '200':
          description: Связь удалена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Для удаления связи нужны права read и update в проекте
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Связь не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/requirements/{id}:
    parameters:
      - $ref: '#/components/parameters/RequirementId'
    put:
      tags: [Requirements]
      summary: Обновить требование
      operationId: updateRequirement
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequirementUpdate'
      responses:
        '200':
          description: Требование обновлено; id, number и projectId сохраняются сервером
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementResponse'
        '400':
          description: Не заполнены обязательные поля или переданы значения вне справочников
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Недостаточно прав для операции
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/RequirementNotFound'
    delete:
      tags: [Requirements]
      summary: Удалить требование
      description: При удалении требования сервер также удаляет все его связи, не удаляя другие связанные требования.
      operationId: deleteRequirement
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Требование удалено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Недостаточно прав для удаления
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/RequirementNotFound'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: HttpOnly cookie, устанавливаемая при успешном входе.
  headers:
    SessionCookie:
      description: Сессионная cookie
      schema:
        type: string
        example: session=0123456789abcdef; HttpOnly; Path=/; SameSite=Lax
    ClearedSessionCookie:
      description: Очищенная сессионная cookie
      schema:
        type: string
        example: session=; HttpOnly; Path=/; Max-Age=0
  parameters:
    UserId:
      name: id
      in: path
      required: true
      description: Идентификатор пользователя
      schema:
        type: string
    RequirementId:
      name: id
      in: path
      required: true
      description: Идентификатор требования
      schema:
        type: string
    GroupId:
      name: id
      in: path
      required: true
      description: Идентификатор группы
      schema:
        type: string
    ProjectIdQuery:
      name: projectId
      in: query
      description: Ограничить выборку проектом
      schema:
        type: string
    SearchQuery:
      name: search
      in: query
      description: Поиск по номеру, описанию и типу требования
      schema:
        type: string
    TypeQuery:
      name: type
      in: query
      style: form
      explode: true
      description: Фильтр по типу; параметр можно передать несколько раз
      schema:
        type: array
        items:
          $ref: '#/components/schemas/RequirementTypeId'
    PriorityQuery:
      name: priority
      in: query
      style: form
      explode: true
      description: Фильтр по приоритету; параметр можно передать несколько раз
      schema:
        type: array
        items:
          $ref: '#/components/schemas/Priority'
    StatusQuery:
      name: status
      in: query
      style: form
      explode: true
      description: Фильтр по статусу; параметр можно передать несколько раз
      schema:
        type: array
        items:
          $ref: '#/components/schemas/Status'
    ComplexityQuery:
      name: complexity
      in: query
      style: form
      explode: true
      description: Фильтр по сложности; параметр можно передать несколько раз
      schema:
        type: array
        items:
          $ref: '#/components/schemas/Complexity'
    ReleaseQuery:
      name: release
      in: query
      style: form
      explode: true
      description: Фильтр по релизу; параметр можно передать несколько раз
      schema:
        type: array
        items:
          type: string
  responses:
    InvalidJson:
      description: Некорректный JSON в теле запроса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Требуется авторизация
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AdminRequired:
      description: Требуются права администратора
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UserNotFound:
      description: Пользователь не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RequirementNotFound:
      description: Требование не найдено
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
      additionalProperties: false
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
      additionalProperties: false
    PermissionSet:
      type: object
      required: [create, read, update, delete]
      properties:
        create:
          type: boolean
        read:
          type: boolean
        update:
          type: boolean
        delete:
          type: boolean
      additionalProperties: false
    UserPublic:
      type: object
      required: [id, username, name, role, projectIds, permissions]
      properties:
        id:
          type: string
        username:
          type: string
        name:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        projectIds:
          type: array
          items:
            type: string
        permissions:
          $ref: '#/components/schemas/PermissionSet'
      additionalProperties: false
    UserWrite:
      type: object
      required: [username, name, password]
      properties:
        username:
          type: string
        name:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        password:
          type: string
          format: password
        projectIds:
          type: array
          items:
            type: string
        permissions:
          $ref: '#/components/schemas/PermissionSet'
      additionalProperties: false
    UserUpdate:
      type: object
      description: Все поля необязательны. Отсутствующие username, name, role и projectIds сохраняются; если permissions не передан, сервер сбрасывает все права в false.
      properties:
        username:
          type: string
        name:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        password:
          type: string
          format: password
        projectIds:
          type: array
          items:
            type: string
        permissions:
          $ref: '#/components/schemas/PermissionSet'
      additionalProperties: false
    Role:
      type: string
      enum: [Администратор, Пользователь]
    Project:
      type: object
      required: [id, name, code]
      properties:
        id:
          type: string
        name:
          type: string
        code:
          type: string
      additionalProperties: false
    RequirementPrefix:
      type: object
      required: [projectId, type, prefix]
      properties:
        projectId:
          type: string
        type:
          $ref: '#/components/schemas/RequirementTypeId'
        prefix:
          type: string
          pattern: '^[A-Za-zА-Яа-яЁё][A-Za-zА-Яа-яЁё0-9_-]{0,19}$'
          description: От 1 до 20 символов, начинается с буквы
      additionalProperties: false
    Requirement:
      type: object
      required: [id, number, description, detailsMarkdown, type, priority, complexity, status, release, projectId]
      properties:
        id:
          type: string
        number:
          type: string
          readOnly: true
          description: Формируется сервером в формате PREFIX-001
        description:
          type: string
        detailsMarkdown:
          type: string
        type:
          $ref: '#/components/schemas/RequirementTypeId'
        priority:
          $ref: '#/components/schemas/Priority'
        complexity:
          type: string
          description: Пустая строка допускается сервером
          enum: [Низкая, Средняя, Высокая, '']
        status:
          $ref: '#/components/schemas/Status'
        release:
          type: string
          description: Может быть пустой строкой
        projectId:
          type: string
          readOnly: true
      additionalProperties: false
    RequirementWrite:
      type: object
      required: [projectId, description, type, priority, status]
      properties:
        projectId:
          type: string
        description:
          type: string
        detailsMarkdown:
          type: string
          default: ''
        type:
          $ref: '#/components/schemas/RequirementTypeId'
        priority:
          $ref: '#/components/schemas/Priority'
        complexity:
          type: string
          enum: [Низкая, Средняя, Высокая, '']
          default: ''
        status:
          $ref: '#/components/schemas/Status'
        release:
          type: string
          default: ''
      additionalProperties: false
    RequirementUpdate:
      type: object
      description: Поля id, number и projectId игнорируются и сохраняются из существующего требования.
      required: [description, type, priority, status]
      properties:
        description:
          type: string
        detailsMarkdown:
          type: string
        type:
          $ref: '#/components/schemas/RequirementTypeId'
        priority:
          $ref: '#/components/schemas/Priority'
        complexity:
          type: string
          enum: [Низкая, Средняя, Высокая, '']
        status:
          $ref: '#/components/schemas/Status'
        release:
          type: string
      additionalProperties: false
    RequirementsResponse:
      type: object
      required: [requirements, releases]
      properties:
        requirements:
          type: array
          items:
            $ref: '#/components/schemas/Requirement'
        releases:
          type: array
          items:
            type: string
    RequirementResponse:
      type: object
      required: [requirement]
      properties:
        requirement:
          $ref: '#/components/schemas/Requirement'
    RequirementLinkType:
      type: object
      required: [id, name, directed]
      properties:
        id:
          type: string
          description: Постоянный идентификатор типа связи
        name:
          type: string
          description: Название типа связи
        directed:
          type: boolean
          description: true для направленного типа, false для симметричного
      additionalProperties: false
    RequirementLinkTypeWrite:
      type: object
      required: [name, directed]
      properties:
        name:
          type: string
          minLength: 1
          description: Название типа; сервер удаляет пробелы по краям и запрещает дубликаты без учёта регистра
        directed:
          type: boolean
      additionalProperties: false
    RequirementLinkTypeResponse:
      type: object
      required: [type]
      properties:
        type:
          $ref: '#/components/schemas/RequirementLinkType'
    DeletedRequirementLinkTypeResponse:
      type: object
      required: [ok, removedLinks]
      properties:
        ok:
          type: boolean
          enum: [true]
        removedLinks:
          type: integer
          minimum: 0
          description: Количество удалённых связей этого типа
      additionalProperties: false
    RequirementLinkWrite:
      type: object
      required: [requirementAId, requirementBId, typeId]
      properties:
        requirementAId:
          type: string
          description: Исходное требование, с карточки которого начато создание связи
        requirementBId:
          type: string
          description: Другое требование, выбранное пользователем
        typeId:
          type: string
          description: Идентификатор типа из общего каталога типов связей
      additionalProperties: false
    RequirementLinkRequirement:
      type: object
      description: Данные требования, включённые в представление связи
      required: [id, number, description, type]
      properties:
        id:
          type: string
        number:
          type: string
        description:
          type: string
        type:
          $ref: '#/components/schemas/RequirementTypeId'
      additionalProperties: true
    RequirementLink:
      type: object
      required: [id, projectId, requirementAId, requirementBId, typeId, type, requirementA, requirementB]
      properties:
        id:
          type: string
        projectId:
          type: string
        requirementAId:
          type: string
          description: Исходное требование направленной связи
        requirementBId:
          type: string
          description: Целевое требование направленной связи
        typeId:
          type: string
        type:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/RequirementLinkType'
        requirementA:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/RequirementLinkRequirement'
        requirementB:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/RequirementLinkRequirement'
      additionalProperties: false
    RequirementLinksResponse:
      type: object
      required: [links]
      properties:
        links:
          type: array
          items:
            $ref: '#/components/schemas/RequirementLink'
      additionalProperties: false
    RequirementLinkResponse:
      type: object
      required: [link]
      properties:
        link:
          $ref: '#/components/schemas/RequirementLink'
      additionalProperties: false
    RequirementLinkSearchResult:
      type: object
      required: [id, number, description, type]
      properties:
        id:
          type: string
        number:
          type: string
        description:
          type: string
        type:
          $ref: '#/components/schemas/RequirementTypeId'
      additionalProperties: false
    RequirementLinkSearchResponse:
      type: object
      required: [requirements]
      properties:
        requirements:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/RequirementLinkSearchResult'
      additionalProperties: false
    UserResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/UserPublic'
    RequirementPrefixesRequest:
      type: object
      required: [prefixes]
      properties:
        prefixes:
          type: array
          items:
            $ref: '#/components/schemas/RequirementPrefix'
      additionalProperties: false
    OkResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          enum: [true]
    Config:
      type: object
      required: [statuses, priorities, complexities, types, projects]
      properties:
        statuses:
          type: array
          items:
            $ref: '#/components/schemas/Status'
        priorities:
          type: array
          items:
            $ref: '#/components/schemas/Priority'
        complexities:
          type: array
          items:
            $ref: '#/components/schemas/Complexity'
        types:
          type: array
          items:
            $ref: '#/components/schemas/RequirementType'
        projects:
          type: array
          items:
            $ref: '#/components/schemas/Project'
    RequirementType:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          description: Постоянный идентификатор типа
        name:
          type: string
          description: Отображаемое название типа
      additionalProperties: false
    RequirementTypeId:
      type: string
      description: Идентификатор типа из справочника types.json
    Status:
      type: string
      enum: [Черновик, В работе, На проверке, На согласовании, Согласовано, Отменено]
    Priority:
      type: string
      enum: [Критическая, Высокая, Средняя, Низкая]
    Complexity:
      type: string
      enum: [Низкая, Средняя, Высокая]
    Group:
      type: object
      required: [id, name, projectId, parentId]
      properties:
        id:
          type: string
          readOnly: true
          description: UUID группы
        name:
          type: string
          maxLength: 200
        projectId:
          type: string
          readOnly: true
          description: ID проекта, которому принадлежит группа
        parentId:
          type: string
          nullable: true
          description: ID родительской группы; null для корневых групп
      additionalProperties: false
    GroupRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Название группы длиной до 200 символов
          maxLength: 200
        parentId:
          type: string
          nullable: true
          description: ID родительской группы; null (или отсутствие) для корневой группы
        projectId:
          type: string
          description: "Обязателен только при создании группы (POST /api/groups). При обновлении игнорируется."
      additionalProperties: false
    GroupResponse:
      type: object
      required: [group]
      properties:
        group:
          $ref: '#/components/schemas/Group'
