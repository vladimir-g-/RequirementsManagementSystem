openapi: 3.0.3
info:
  title: Requirements Management System API
  description: API серверной части системы управления требованиями, включая управление проектами и типами требований, самостоятельную смену пароля, каталог типов связей и связи требований.
  version: 1.2.0
  license:
    name: Proprietary
servers:
  - url: http://localhost:3000
    description: Локальный сервер
tags:
  - name: Auth
    description: Аутентификация и текущая сессия
  - name: Config
    description: Справочники интерфейса
  - name: Groups
    description: Иерархические группы требований
  - name: Projects
    description: Проекты, доступные пользователю
  - name: Requirement types
    description: Общий справочник типов требований (управление только администратором)
  - name: Requirements
    description: Требования
  - name: Requirement prefixes
    description: Префиксы номеров требований (только администратор)
  - name: Requirement links
    description: Общий каталог типов и связи между требованиями
  - name: Users
    description: Пользователи (только администратор)
paths:
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Войти в систему
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Успешный вход. В ответе устанавливается cookie session.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/InvalidJson'
        '401':
          description: Неверный логин или пароль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Завершить текущую сессию
      operationId: logout
      security:
        - sessionCookie: []
      responses:
        '204':
          description: Сессия завершена, cookie session очищена
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ClearedSessionCookie'

  /api/auth/password:
    post:
      tags: [Auth]
      summary: Изменить собственный пароль
      description: Новый пароль и его подтверждение должны быть непустыми и совпадать. После сохранения система отзывает активные сеансы пользователя; в ответе очищается cookie текущего сеанса, если он завершён.
      operationId: changeOwnPassword
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
      responses:
        '200':
          description: Пароль сохранён; результат отзыва сеансов указан в ответе
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ClearedSessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordChangeResponse'
        '400':
          description: Поля пароля не заполнены или значения не совпадают
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: Не удалось сохранить новый пароль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Получить текущего пользователя
      operationId: getCurrentUser
      security: []
      responses:
        '200':
          description: Текущий пользователь или null, если сессия отсутствует
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    oneOf:
                      - $ref: '#/components/schemas/UserPublic'
                      - type: object
                        nullable: true

  /api/config:
    get:
      tags: [Config]
      summary: Получить справочники
      operationId: getConfig
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Статусы, важность и сложность. Проекты возвращаются через /api/projects, типы требований — через /api/requirement-types.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Config'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/projects:
    get:
      tags: [Projects]
      summary: Получить доступные проекты
      operationId: listProjects
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Для администратора возвращаются все проекты, для остальных пользователей — назначенные
          content:
            application/json:
              schema:
                type: object
                required: [projects]
                properties:
                  projects:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Projects]
      summary: Создать проект
      description: Доступно только администратору. Название и код уникальны без учёта регистра.
      operationId: createProject
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectWrite'
      responses:
        '201':
          description: Проект создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400':
          description: Название или код пусты, превышают допустимую длину либо не уникальны; код содержит недопустимые символы
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'

  /api/projects/{id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    put:
      tags: [Projects]
      summary: Изменить проект
      description: Доступно только администратору. Код можно изменить только пока в проекте нет требований и групп.
      operationId: updateProject
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdate'
      responses:
        '200':
          description: Проект изменён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400':
          description: Название или новый код не прошли проверку
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '404':
          description: Проект не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Код проекта нельзя изменить, пока в проекте есть требования или группы
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Projects]
      summary: Удалить проект
      description: Доступно только администратору. При удалении очищаются назначения пользователей и настройки префиксов проекта.
      operationId: deleteProject
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Проект удалён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '404':
          description: Проект не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Нельзя удалить проект, пока в нём есть требования или группы
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/requirement-types:
    get:
      tags: [Requirement types]
      summary: Получить типы требований
      description: Доступно любому аутентифицированному пользователю для выбора при создании и изменении требований. Изменять справочник может только администратор.
      operationId: listRequirementTypes
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Типы требований из управляемого системного справочника
          content:
            application/json:
              schema:
                type: object
                required: [types]
                properties:
                  types:
                    type: array
                    items:
                      $ref: '#/components/schemas/RequirementType'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Requirement types]
      summary: Создать тип требования
      description: Название обязательно, не длиннее 50 символов и уникально без учёта регистра. Доступно только администратору.
      operationId: createRequirementType
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequirementTypeWrite'
      responses:
        '201':
          description: Тип требования создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementTypeResponse'
        '400':
          description: Некорректное или уже используемое название типа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'

  /api/requirement-types/{id}:
    parameters:
      - $ref: '#/components/parameters/RequirementTypeId'
    put:
      tags: [Requirement types]
      summary: Изменить тип требования
      description: Название можно изменить, даже если тип используется. Идентификатор типа и настройки префиксов сохраняются. Доступно только администратору.
      operationId: updateRequirementType
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequirementTypeWrite'
      responses:
        '200':
          description: Тип требования изменён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementTypeResponse'
        '400':
          description: Некорректное или уже используемое название типа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '404':
          description: Тип требования не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Requirement types]
      summary: Удалить тип требования
      description: Удалить можно только тип, не используемый требованиями. Настройки префиксов для этого типа во всех проектах удаляются. Доступно только администратору.
      operationId: deleteRequirementType
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Тип требования удалён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '404':
          description: Тип требования не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Тип требования используется и не может быть удалён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/groups:
    get:
      tags: [Groups]
      summary: Получить группы проекта
      operationId: listGroups
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ProjectIdQuery'
      responses:
        '200':
          description: Группы проекта с учётом прав доступа пользователя
          content:
            application/json:
              schema:
                type: object
                required: [groups]
                properties:
                  groups:
                    type: array
                    items:
                      $ref: '#/components/schemas/Group'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: У пользователя нет права просмотра групп
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [Groups]
      summary: Создать группу требований
      operationId: createGroup
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupCreateRequest'
      responses:
        '201':
          description: Группа создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupResponse'
        '400':
          description: Не заполнены обязательные поля, указано неизвестный проект или родительская группа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Нет права создавать группы в указанном проекте
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/groups/{id}:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      tags: [Groups]
      summary: Получить группу по идентификатору
      operationId: getGroup
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Группа найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: У пользователя нет права просмотра группы
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Группа не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags: [Groups]
      summary: Обновить группу требований
      operationId: updateGroup
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupRequest'
      responses:
        '200':
          description: Группа обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupResponse'
        '400':
          description: Не заполнены обязательные поля, указано неизвестная родительская группа или недопустимая иерархия
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Недостаточно прав для изменения группы
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Группа не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Groups]
      summary: Удалить группу требований
      operationId: deleteGroup
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Группа удалена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Недостаточно прав для удаления группы
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Группа не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Нельзя удалить группу — в ней есть требования или есть дочерние группы
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/requirement-prefixes:
    get:
      tags: [Requirement prefixes]
      summary: Получить префиксы требований
      operationId: listRequirementPrefixes
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Префиксы для каждой пары проект–тип требования
          content:
            application/json:
              schema:
                type: object
                required: [prefixes]
                properties:
                  prefixes:
                    type: array
                    items:
                      $ref: '#/components/schemas/RequirementPrefix'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
    put:
      tags: [Requirement prefixes]
      summary: Сохранить префиксы требований
      operationId: updateRequirementPrefixes
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequirementPrefixesRequest'
      responses:
        '200':
          description: Префиксы сохранены
          content:
            application/json:
              schema:
                type: object
                required: [prefixes]
                properties:
                  prefixes:
                    type: array
                    items:
                      $ref: '#/components/schemas/RequirementPrefix'
        '400':
          description: Некорректный список, неизвестный проект или тип, дубликат пары или неверный формат префикса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'

  /api/requirement-link-options:
    get:
      tags: [Requirement links]
      summary: Получить типы связей для создания требования
      description: Совместимый маршрут для выбора связей при создании требования. Требуются права create и read в проекте.
      operationId: getRequirementLinkOptionsForCreation
      security:
        - sessionCookie: []
      parameters:
        - name: projectId
          in: query
          required: true
          description: Идентификатор проекта, для которого загружается каталог типов связей
          schema:
            type: string
      responses:
        '200':
          description: Каталог типов связей
          content:
            application/json:
              schema:
                type: object
                required: [types]
                properties:
                  types:
                    type: array
                    items:
                      $ref: '#/components/schemas/RequirementLinkType'
        '400':
          description: Указан неизвестный проект
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Для выбора связанных требований нужны права создания и чтения в проекте
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/requirement-link-types:
    get:
      tags: [Requirement links]
      summary: Получить каталог типов связей
      description: Доступно только пользователю с системной ролью «Администратор».
      operationId: listRequirementLinkTypes
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Единый для всех проектов каталог типов связей
          content:
            application/json:
              schema:
                type: object
                required: [types]
                properties:
                  types:
                    type: array
                    items:
                      $ref: '#/components/schemas/RequirementLinkType'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
    post:
      tags: [Requirement links]
      summary: Создать тип связи
      description: Доступно только администратору. Название должно быть уникальным без учёта регистра.
      operationId: createRequirementLinkType
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequirementLinkTypeWrite'
      responses:
        '201':
          description: Тип связи создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementLinkTypeResponse'
        '400':
          description: Некорректное или неполное тело запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '409':
          description: Тип связи с таким названием уже существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/requirement-link-types/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Идентификатор типа связи
        schema:
          type: string
    put:
      tags: [Requirement links]
      summary: Изменить тип связи
      description: Изменение направленности применяется ко всем существующим связям данного типа. Доступно только администратору.
      operationId: updateRequirementLinkType
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequirementLinkTypeWrite'
      responses:
        '200':
          description: Тип связи изменён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementLinkTypeResponse'
        '400':
          description: Некорректное или неполное тело запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '404':
          description: Тип связи не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Тип связи с таким названием уже существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Requirement links]
      summary: Удалить тип связи
      description: Удаляет также все связи этого типа во всех проектах, но не удаляет требования. Доступно только администратору.
      operationId: deleteRequirementLinkType
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Тип связи удалён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedRequirementLinkTypeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '404':
          description: Тип связи не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/users:
    get:
      tags: [Users]
      summary: Получить список пользователей
      operationId: listUsers
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Пользователи без хешей паролей
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserPublic'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
    post:
      tags: [Users]
      summary: Создать пользователя
      operationId: createUser
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserWrite'
      responses:
        '201':
          description: Пользователь создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Не заполнены обязательные поля, логин не уникален или указан неизвестный проект
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'

  /api/users/{id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    put:
      tags: [Users]
      summary: Обновить пользователя
      operationId: updateUser
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Пользователь обновлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Некорректные или конфликтующие данные пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '404':
          $ref: '#/components/responses/UserNotFound'
    delete:
      tags: [Users]
      summary: Удалить пользователя
      operationId: deleteUser
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Пользователь удален
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '400':
          description: Нельзя удалить текущего пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminRequired'
        '404':
          $ref: '#/components/responses/UserNotFound'

  /api/requirements:
    get:
      tags: [Requirements]
      summary: Получить требования
      operationId: listRequirements
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ProjectIdQuery'
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/TypeQuery'
        - $ref: '#/components/parameters/PriorityQuery'
        - $ref: '#/components/parameters/StatusQuery'
        - $ref: '#/components/parameters/ComplexityQuery'
        - $ref: '#/components/parameters/ReleaseQuery'
      responses:
        '200':
          description: Требования и список релизов, найденных в видимой области
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: У пользователя нет права чтения требований
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [Requirements]
      summary: Создать требование
      operationId: createRequirement
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequirementWrite'
      responses:
        '201':
          description: Требование создано; номер формируется сервером, а переданные связи создаются в той же операции
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementCreateResponse'
        '400':
          description: Не заполнены обязательные поля, переданы значения вне справочников или некорректны группа/связи
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Нет права создавать требования в проекте
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/requirements/search:
    get:
      tags: [Requirement links]
      summary: Найти требование для связывания
      description: Поиск ограничен проектом. При передаче excludeId исключает исходное требование и требует права read и update; без excludeId используется при создании требования и требует права create и read. Возвращается не более 20 совпадений.
      operationId: searchRequirementsForLink
      security:
        - sessionCookie: []
      parameters:
        - name: projectId
          in: query
          required: true
          description: Проект исходного требования
          schema:
            type: string
        - name: excludeId
          in: query
          required: false
          description: Идентификатор исходного требования, исключаемого из результатов. Если не указан, поиск выполняется для создания требования.
          schema:
            type: string
        - name: search
          in: query
          required: true
          description: Поисковая строка; поиск выполняется по номеру, описанию и типу требования
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Найденные требования того же проекта, максимум 20
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementLinkSearchResponse'
        '400':
          description: Не указан поисковый запрос или исходное требование не соответствует проекту
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: При поиске для изменения нужны права read и update; при поиске для создания нужны права create и read в проекте
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/requirements/{id}/link-options:
    get:
      tags: [Requirement links]
      summary: Получить доступные типы связей для требования
      description: Требуются права read и update в проекте требования.
      operationId: getRequirementLinkOptions
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequirementId'
      responses:
        '200':
          description: Каталог типов, доступных при создании связи
          content:
            application/json:
              schema:
                type: object
                required: [types]
                properties:
                  types:
                    type: array
                    items:
                      $ref: '#/components/schemas/RequirementLinkType'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Для создания связи нужны права read и update
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/RequirementNotFound'

  /api/requirements/{id}/links:
    get:
      tags: [Requirement links]
      summary: Получить связи требования
      description: Требуется право read в проекте требования. Направленные связи возвращают стороны A и B в исходном направлении независимо от карточки, с которой запрошен список.
      operationId: listRequirementLinks
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequirementId'
      responses:
        '200':
          description: Связи требования с данными типа и обеих сторон
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementLinksResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Нет права просматривать связи требований в этом проекте
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/RequirementNotFound'

  /api/requirement-links:
    post:
      tags: [Requirement links]
      summary: Создать связь между требованиями
      description: Требуются права read и update. Требования должны быть разными и принадлежать одному проекту. Для направленного типа requirementAId — исходное требование, с карточки которого начата операция; requirementBId — выбранное требование. Между одной парой допускается только одна связь независимо от типа и направления.
      operationId: createRequirementLink
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequirementLinkWrite'
      responses:
        '201':
          description: Связь создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementLinkResponse'
        '400':
          description: Самосвязь, разные проекты или неизвестный тип связи
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Для создания связи нужны права read и update в проекте
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Одно из требований не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Эта пара требований уже связана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/requirement-links/{id}:
    delete:
      tags: [Requirement links]
      summary: Удалить связь между требованиями
      description: Требуются права read и update в проекте. Удаляются только связь, сами требования сохраняются.
      operationId: deleteRequirementLink
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          description: Идентификатор связи
          schema:
            type: string
      responses:
        '200':
          description: Связь удалена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Для удаления связи нужны права read и update в проекте
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Связь не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/requirements/{id}:
    parameters:
      - $ref: '#/components/parameters/RequirementId'
    put:
      tags: [Requirements]
      summary: Обновить требование
      description: Требуются независимые права read и update в проекте требования. Если сохранение перезапишет параллельно сохранённые данные, сервер отклоняет изменение и сообщает о конфликте.
      operationId: updateRequirement
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequirementUpdate'
      responses:
        '200':
          description: Требование обновлено; id, number и projectId сохраняются сервером, version увеличивается
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementResponse'
        '400':
          description: Не заполнены обязательные поля или переданы значения вне справочников
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Для изменения нужны права read и update в проекте
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/RequirementNotFound'
        '409':
          description: Конфликт параллельных изменений; требование не обновлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Requirements]
      summary: Удалить требование
      description: Требуются независимые права read и delete в проекте требования. При удалении сервер также удаляет все его связи, не удаляя другие связанные требования.
      operationId: deleteRequirement
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Требование удалено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Для удаления нужны права read и delete в проекте
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/RequirementNotFound'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: HttpOnly cookie, устанавливаемая при успешном входе.
  headers:
    SessionCookie:
      description: Сессионная cookie
      schema:
        type: string
        example: session=0123456789abcdef; HttpOnly; Path=/; SameSite=Lax
    ClearedSessionCookie:
      description: Очищенная сессионная cookie
      schema:
        type: string
        example: session=; HttpOnly; Path=/; Max-Age=0
  parameters:
    UserId:
      name: id
      in: path
      required: true
      description: Идентификатор пользователя
      schema:
        type: string
    RequirementId:
      name: id
      in: path
      required: true
      description: Идентификатор требования
      schema:
        type: string
    GroupId:
      name: id
      in: path
      required: true
      description: Идентификатор группы
      schema:
        type: string
    ProjectId:
      name: id
      in: path
      required: true
      description: Идентификатор проекта
      schema:
        type: string
    RequirementTypeId:
      name: id
      in: path
      required: true
      description: Идентификатор типа требования
      schema:
        type: string
    ProjectIdQuery:
      name: projectId
      in: query
      description: Ограничить выборку проектом
      schema:
        type: string
    SearchQuery:
      name: search
      in: query
      description: Поиск по номеру, описанию и типу требования
      schema:
        type: string
    TypeQuery:
      name: type
      in: query
      style: form
      explode: true
      description: Фильтр по типу; параметр можно передать несколько раз
      schema:
        type: array
        items:
          $ref: '#/components/schemas/RequirementTypeId'
    PriorityQuery:
      name: priority
      in: query
      style: form
      explode: true
      description: Фильтр по приоритету; параметр можно передать несколько раз
      schema:
        type: array
        items:
          $ref: '#/components/schemas/Priority'
    StatusQuery:
      name: status
      in: query
      style: form
      explode: true
      description: Фильтр по статусу; параметр можно передать несколько раз
      schema:
        type: array
        items:
          $ref: '#/components/schemas/Status'
    ComplexityQuery:
      name: complexity
      in: query
      style: form
      explode: true
      description: Фильтр по сложности; параметр можно передать несколько раз
      schema:
        type: array
        items:
          $ref: '#/components/schemas/Complexity'
    ReleaseQuery:
      name: release
      in: query
      style: form
      explode: true
      description: Фильтр по релизу; параметр можно передать несколько раз
      schema:
        type: array
        items:
          type: string
  responses:
    InvalidJson:
      description: Некорректный JSON в теле запроса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Требуется авторизация
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AdminRequired:
      description: Требуются права администратора
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UserNotFound:
      description: Пользователь не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RequirementNotFound:
      description: Требование не найдено
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
      additionalProperties: false
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
      additionalProperties: false
    PasswordChangeRequest:
      type: object
      required: [newPassword, confirmPassword]
      properties:
        newPassword:
          type: string
          format: password
          minLength: 1
        confirmPassword:
          type: string
          format: password
          minLength: 1
      additionalProperties: false
    PasswordChangeResponse:
      type: object
      required: [currentSessionTerminated, failedSessionCount]
      properties:
        currentSessionTerminated:
          type: boolean
          description: Завершён ли сеанс, использованный для запроса
        failedSessionCount:
          type: integer
          minimum: 0
          description: Число сеансов, завершить которые не удалось
      additionalProperties: false
    PermissionSet:
      type: object
      required: [create, read, update, delete]
      properties:
        create:
          type: boolean
        read:
          type: boolean
        update:
          type: boolean
        delete:
          type: boolean
      additionalProperties: false
    UserPublic:
      type: object
      required: [id, username, name, role, projectIds, projectPermissions]
      properties:
        id:
          type: string
        username:
          type: string
        name:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        projectIds:
          type: array
          items:
            type: string
        projectPermissions:
          type: object
          description: Права пользователя по проектам
          additionalProperties:
            $ref: '#/components/schemas/PermissionSet'
      additionalProperties: false
    UserWrite:
      type: object
      required: [username, name, password]
      properties:
        username:
          type: string
        name:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        password:
          type: string
          format: password
        projectIds:
          type: array
          items:
            type: string
        projectPermissions:
          type: object
          description: Права пользователя по проектам; неуказанные права новых назначений считаются false
          additionalProperties:
            $ref: '#/components/schemas/PermissionSet'
      additionalProperties: false
    UserUpdate:
      type: object
      description: Все поля необязательны. Отсутствующие username, name, role и projectIds сохраняются. projectPermissions задаёт права по каждому назначенному проекту.
      properties:
        username:
          type: string
        name:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        password:
          type: string
          format: password
        projectIds:
          type: array
          items:
            type: string
        projectPermissions:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/PermissionSet'
      additionalProperties: false
    Role:
      type: string
      enum: [Администратор, Пользователь]
    Project:
      type: object
      required: [id, name, code]
      properties:
        id:
          type: string
        name:
          type: string
        code:
          type: string
      additionalProperties: false
    ProjectWrite:
      type: object
      required: [name, code]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Название проекта, уникальное без учёта регистра
        code:
          type: string
          pattern: '^[A-Za-zА-Яа-яЁё0-9_-]{1,20}$'
          description: Уникальный без учёта регистра код длиной до 20 символов
      additionalProperties: false
    ProjectUpdate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Название проекта, уникальное без учёта регистра
        code:
          type: string
          pattern: '^[A-Za-zА-Яа-яЁё0-9_-]{1,20}$'
          description: Если передан, код можно изменить только для пустого проекта
      additionalProperties: false
    ProjectResponse:
      type: object
      required: [project]
      properties:
        project:
          $ref: '#/components/schemas/Project'
      additionalProperties: false
    RequirementPrefix:
      type: object
      required: [projectId, type, prefix]
      properties:
        projectId:
          type: string
        type:
          $ref: '#/components/schemas/RequirementTypeId'
        prefix:
          type: string
          pattern: '^[A-Za-zА-Яа-яЁё][A-Za-zА-Яа-яЁё0-9_-]{0,19}$'
          description: От 1 до 20 символов, начинается с буквы
      additionalProperties: false
    Requirement:
      type: object
      required: [id, number, description, detailsMarkdown, type, priority, complexity, status, release, projectId, groupId, version]
      properties:
        id:
          type: string
        number:
          type: string
          readOnly: true
          description: Формируется сервером в формате PREFIX-001
        description:
          type: string
        detailsMarkdown:
          type: string
        type:
          $ref: '#/components/schemas/RequirementTypeId'
        priority:
          $ref: '#/components/schemas/Priority'
        complexity:
          type: string
